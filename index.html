<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Federal Motion — Alpha 0.3</title>
  <script>
    // Alpha updater: force the newest UI files whenever the page is loaded/refreshed.
    const FM_BUILD = Date.now();
    document.write('<link rel="stylesheet" href="styles.css?v=0.3.5?v=' + FM_BUILD + '">');
  </script>
</head>
<body>
  <main id="app" class="app-shell"></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const fmScript = document.createElement('script');
    fmScript.src = 'app.js?v=0.3.5?v=' + FM_BUILD;
    document.body.appendChild(fmScript);
  </script>
</body>
</html>
